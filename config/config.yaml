proveedor: openai
modelo: gpt-6-astra
idioma: español de España
zona_horaria: Europe/Madrid
nivel_servicio: default

proveedores:
  openai:
    nombre_visible: OpenAI
    base_url: https://api.openai.com/v1
    clave_entorno: OPENAI_API_KEY
    modelo: gpt-6-astra
  openrouter:
    nombre_visible: OpenRouter
    base_url: https://openrouter.ai/api/v1
    clave_entorno: OPENROUTER_API_KEY
    modelo: openai/gpt-6-astra

ia:
  respaldo: openrouter
  cambio_automatico: true
  reintento_principal_segundos: 120

api:
  timeout_segundos: 30
  reintentos: 2

agente:
  pasos_herramienta_maximos: 5

limites:
  tokens_salida_maximos: 2000
  turnos_historial_maximos: 20

precios_usd_por_millon:
  entrada: 10.0
  entrada_cache: 1.0
  escritura_cache: 12.5
  salida: 50.0
